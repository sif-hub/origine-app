name: origine
description: Plateforme généalogique et culturelle camerounaise
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Réseau / API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Stockage local (JWT, préférences)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Arbre généalogique (canvas)
  graphview: ^1.2.0

  # Image
  image_picker: ^1.0.7

  # Sélection de documents (actes PDF/JPG/PNG)
  file_picker: ^8.1.2

  # Icônes
  lucide_icons: ^0.257.0

  # Synthèse vocale (écouter une histoire)
  flutter_tts: ^4.2.0

  # Calendrier familial
  table_calendar: ^3.1.2

  # Partage natif (histoires)
  share_plus: ^10.1.4

  # Notifications Web Push (chat familial)
  web: ^1.1.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#C9942C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0A3D2E"
    theme_color: "#0A3D2E"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
